# Copy this file to .github/workflows/reminders.yml in your PRIVATE data repo (e.g. dailies-data).
# Required secret in that repo: NTFY_TOPIC (your secret ntfy topic name). Optional: NTFY_TOKEN.
#
# GitHub's own cron scheduler is far too unreliable for timed reminders (runs land hours late or
# are dropped). The real trigger is an external scheduler (cron-job.org, or an iOS Shortcuts
# automation) calling this workflow's workflow_dispatch API at 8:30 AM and 8:30 PM with
# slot=morning / slot=evening. Dispatched runs start within about a minute.
#
# remind.js sends at most one reminder per window and only if something is left, so the
# backup cron below and any duplicate triggers are harmless.
name: Daily reminders

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Which reminder to send (auto = based on the current time)
        type: choice
        options: [auto, morning, evening]
        default: auto
      test:
        description: Send a test notification even if everything is done
        type: boolean
        default: false
  schedule:
    # Best-effort backup only (UTC; covers both PST and PDT).
    - cron: '*/15 15-19 * * *'
    - cron: '*/15 3-7 * * *'

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out data
        uses: actions/checkout@v5
        with:
          path: data

      - name: Check out tracker (reminder script)
        uses: actions/checkout@v5
        with:
          repository: Sid-V/dailies-tracker
          path: tracker

      - name: Send reminder if anything is left
        run: node tracker/reminders/remind.js
        env:
          DATA_FILE: data/data.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REMINDER_TZ: America/Los_Angeles
          TRACKER_URL: https://sid-v.github.io/dailies-tracker/
          SLOT: ${{ inputs.slot }}
          TEST: ${{ inputs.test }}
