# Copy this file to .github/workflows/reminders.yml in your PRIVATE data repo (e.g. dailies-data).
# Required secret in that repo: NTFY_TOPIC (your secret ntfy topic name). Optional: NTFY_TOKEN.
#
# GitHub's scheduler often runs cron jobs late (sometimes by hours), so instead of two exact
# times this polls every 15 minutes around each window. remind.js sends at most one reminder per
# window: the first run after 8:30 AM and after 8:30 PM (REMINDER_TZ), and only if a game is left.
# Crons are in UTC and cover both PST and PDT:
#   morning 15:00-19:59 UTC = 7:00-11:59 PST / 8:00-12:59 PDT
#   evening 03:00-07:59 UTC = 7:00-11:59 PM PST / 8:00 PM-12:59 AM PDT
# That's ~40 short runs a day (~1,200 Actions minutes/month, within the free 2,000 for private repos).
name: Daily reminders

on:
  schedule:
    - cron: '*/15 15-19 * * *'
    - cron: '*/15 3-7 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test notification even if everything is done
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out data
        uses: actions/checkout@v5
        with:
          path: data

      - name: Check out tracker (reminder script)
        uses: actions/checkout@v5
        with:
          repository: Sid-V/dailies-tracker
          path: tracker

      - name: Send reminder if anything is left
        run: node tracker/reminders/remind.js
        env:
          DATA_FILE: data/data.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          REMINDER_TZ: America/Los_Angeles
          TRACKER_URL: https://sid-v.github.io/dailies-tracker/
          TEST: ${{ inputs.test }}
